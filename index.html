<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hide The Evidence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { user-select: none; -webkit-user-select: none; background: #0f172a; color: white; overflow: hidden; font-family: system-ui, sans-serif; }
        .draggable { touch-action: none; cursor: grab; }
        .draggable:active { cursor: grabbing; }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 4px); }
            40% { transform: translate(8px, -4px); }
            60% { transform: translate(-4px, -8px); }
            80% { transform: translate(4px, 8px); }
        }
        .shake-active { animation: shake 0.3s infinite; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative">

    <!-- MAIN MENU -->
    <div id="main-menu" class="absolute inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-4xl font-black mb-2 text-red-500 tracking-wider">HIDE THE EVIDENCE</h1>
        <p class="text-slate-400 mb-6 max-w-sm text-sm">Boyfriend is at the door! Drag and hide all the scattered evidence around the room before time runs out!</p>
        
        <button onclick="startGame()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-8 py-4 rounded-xl text-lg shadow-lg shadow-red-900/50 transition transform active:scale-95 mb-4 w-64">
            START PANIC
        </button>

        <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-6 py-3 rounded-xl text-sm border border-slate-700 cursor-pointer transition w-64 flex items-center justify-center gap-2">
            <span>📁 Upload Background</span>
            <input type="file" id="bg-upload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
        </label>
    </div>

    <!-- GAME CONTAINER -->
    <div id="game-container" class="relative w-full max-w-md h-full max-h-[850px] bg-slate-900 overflow-hidden shadow-2xl flex flex-col hidden">
        
        <!-- SCENE BACKGROUND -->
        <div id="scene-bg" class="absolute inset-0 bg-cover bg-center transition-all duration-300" style="background-image: url('https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&q=80&w=1000');">
            <div class="absolute inset-0 bg-black/40"></div>
        </div>

        <!-- TOP HUD -->
        <div class="relative z-20 flex justify-between items-center p-4 bg-gradient-to-b from-black/80 to-transparent">
            <div class="text-red-400 font-bold tracking-widest text-sm bg-black/50 px-3 py-1 rounded-full border border-red-500/30 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                <span>PANIC TIMER</span>
            </div>
            <div id="timer-display" class="text-2xl font-black text-white font-mono">60s</div>
        </div>

        <!-- INTERACTIVE PLAYFIELD -->
        <div id="playfield" class="relative flex-1 w-full">
            <!-- Drop Zones -->
            <div id="drop-bed" class="absolute bottom-10 right-6 w-36 h-20 border-2 border-dashed border-white/20 rounded-lg flex items-center justify-center bg-black/20 text-xs text-white/50 backdrop-blur-sm pointer-events-none">
                Under Bed
            </div>
            <div id="drop-suitcase" class="absolute top-1/3 left-6 w-24 h-32 border-2 border-dashed border-white/20 rounded-lg flex items-center justify-center bg-black/20 text-xs text-white/50 backdrop-blur-sm pointer-events-none">
                Suitcase
            </div>

            <!-- Draggable Evidence Items -->
            <div class="draggable absolute bottom-24 left-1/2 -translate-x-1/2 p-3 bg-red-600/90 text-white font-bold rounded-lg shadow-xl border border-red-400 flex items-center gap-2 text-sm" data-id="dress" style="touch-action: none;">
                👗 Red Dress
            </div>
            <div class="draggable absolute bottom-36 left-12 p-3 bg-pink-600/90 text-white font-bold rounded-lg shadow-xl border border-pink-400 flex items-center gap-2 text-sm" data-id="lipstick" style="touch-action: none;">
                💄 Lipstick
            </div>
            <div class="draggable absolute top-1/2 right-12 p-3 bg-amber-700/90 text-white font-bold rounded-lg shadow-xl border border-amber-500 flex items-center gap-2 text-sm" data-id="purse" style="touch-action: none;">
                👜 Designer Purse
            </div>
            <div class="draggable absolute bottom-16 left-1/4 p-3 bg-rose-600/90 text-white font-bold rounded-lg shadow-xl border border-rose-400 flex items-center gap-2 text-sm" data-id="heels" style="touch-action: none;">
                👠 High Heels
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal" class="absolute inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-6 text-center hidden">
        <h2 id="modal-title" class="text-3xl font-black mb-2"></h2>
        <p id="modal-text" class="text-slate-400 mb-6 text-sm"></p>
        <button onclick="resetGame()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-3 rounded-xl text-base shadow-lg transition">
            Play Again
        </button>
    </div>

    <script>
        let timeLeft = 60;
        let timerInterval = null;
        let itemsRemaining = 4;
        let gameActive = false;

        function startGame() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            document.getElementById('modal').classList.add('hidden');
            
            timeLeft = 60;
            itemsRemaining = 4;
            gameActive = true;
            document.getElementById('timer-display').innerText = timeLeft + 's';
            document.getElementById('scene-bg').classList.add('shake-active');

            const items = document.querySelectorAll('.draggable');
            items.forEach((item) => {
                item.style.display = 'flex';
                item.style.transform = 'translate(0px, 0px)';
                item.dataset.x = 0;
                item.dataset.y = 0;
            });

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = timeLeft + 's';
                if (timeLeft <= 0) endGame(false);
            }, 1000);
        }

        function endGame(won) {
            gameActive = false;
            clearInterval(timerInterval);
            document.getElementById('scene-bg').classList.remove('shake-active');
            
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const text = document.getElementById('modal-text');
            
            modal.classList.remove('hidden');
            if (won) {
                title.innerText = "SUCCESS!";
                title.className = "text-3xl font-black mb-2 text-green-500";
                text.innerText = "You successfully hid all the evidence just in time!";
            } else {
                title.innerText = "BUSTED!";
                title.className = "text-3xl font-black mb-2 text-red-500";
                text.innerText = "The door broke down! You ran out of time.";
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('scene-bg').style.backgroundImage = `url('${e.target.result}')`;
                };
                reader.readAsDataURL(file);
            }
        }

        // Smooth Touch & Mouse Dragging Engine
        const draggables = document.querySelectorAll('.draggable');
        draggables.forEach(draggable => {
            let startX = 0, startY = 0, currentX = 0, currentY = 0;
            let isDragging = false;

            draggable.addEventListener('pointerdown', (e) => {
                if (!gameActive) return;
                isDragging = true;
                startX = e.clientX - (parseFloat(draggable.dataset.x) || 0);
                startY = e.clientY - (parseFloat(draggable.dataset.y) || 0);
                draggable.setPointerCapture(e.pointerId);
                draggable.style.zIndex = 100;
            });

            draggable.addEventListener('pointermove', (e) => {
                if (!isDragging || !gameActive) return;
                currentX = e.clientX - startX;
                currentY = e.clientY - startY;
                draggable.dataset.x = currentX;
                draggable.dataset.y = currentY;
                draggable.style.transform = `translate(${currentX}px, ${currentY}px)`;
            });

            draggable.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                draggable.style.zIndex = 10;

                const rect = draggable.getBoundingClientRect();
                const bedRect = document.getElementById('drop-bed').getBoundingClientRect();
                const suitcaseRect = document.getElementById('drop-suitcase').getBoundingClientRect();

                const isOverBed = (rect.left < bedRect.right && rect.right > bedRect.left && rect.top < bedRect.bottom && rect.bottom > bedRect.top);
                const isOverSuitcase = (rect.left < suitcaseRect.right && rect.right > suitcaseRect.left && rect.top < suitcaseRect.bottom && rect.bottom > suitcaseRect.top);

                if (isOverBed || isOverSuitcase) {
                    draggable.style.display = 'none';
                    itemsRemaining--;
                    if (itemsRemaining <= 0) endGame(true);
                }
            });
        });

        function resetGame() {
            document.getElementById('modal').classList.add('hidden');
            startGame();
        }
    </script>
</body>
</html>
